<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5f6">
    <title>Page not found — Pill Reminder</title>
    <link rel="icon" href="assets/favicon-32.png">
    <link rel="stylesheet" href="styles.css">
    <script>
      // Apply the theme before first paint: saved choice, else the OS
      // preference, else light. Keep in sync with script.js.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var saved = null;
        try { saved = localStorage.getItem("pr-theme"); } catch (e) {}
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        root.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Primary navigation">
        <a class="brand" href="index.html"><img src="assets/app-icon-180.png" alt=""><span>Pill Reminder</span></a>
        <div class="nav-links"><a href="index.html">Home</a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Switch light or dark mode"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M3.6 12h2.6M17.8 12h2.6M5.9 5.9l1.8 1.8M16.3 16.3l1.8 1.8M18.1 5.9l-1.8 1.8M7.7 16.3l-1.8 1.8"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/></svg></button></div>
      </nav>
    </header>
    <main>
      <div class="container not-found">
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a class="button button-primary" href="index.html">Back to home</a>
      </div>
    </main>
    <footer class="site-footer"><div class="container"><p class="copyright">© <span data-year>2026</span> Pill Reminder.</p></div></footer>
    <script src="script.js"></script>
  </body>
</html>
